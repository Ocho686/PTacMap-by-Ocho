<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTacMap by Ocho</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="map-container">
<div class="map-info-panel">
  <div class="map-info-title">MAP INFO</div>

  <label class="map-toggle">
  <span class="map-toggle-name">
    <span class="map-toggle-icon car-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="
          M7 3 H17 L19 8 L20 18 H17 V21 H14 V18
          H10 V21 H7 V18 H4 L5 8 Z
          M8 5 L6.5 9 H17.5 L16 5 Z
          M7 12 A2 2 0 1 0 7 16 A2 2 0 1 0 7 12
          M17 12 A2 2 0 1 0 17 16 A2 2 0 1 0 17 12
        "/>
      </svg>
    </span>
    <span>Cars</span>
  </span>

  <input type="checkbox" data-poi-toggle="car" checked>
</label>

<label class="map-toggle">
  <span class="map-toggle-name">
    <span class="map-toggle-icon glider-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 5 L20 5 L13 12 Z"/>
        <path d="M20 5 L20 21 L13 12 Z"/>
        <path
          d="M13 12 L9 13.5 L13 18 L15 13 Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </svg>
    </span>
    <span>Gliders</span>
  </span>

  <input type="checkbox" data-poi-toggle="glider" checked>
</label>

<label class="map-toggle">
  <span class="map-toggle-name">
    <span class="map-toggle-icon secret-room-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="
          M8 3 A5 5 0 1 0 8 13 A5 5 0 0 0 8 3
          M8 6 A2 2 0 1 1 8 10 A2 2 0 0 1 8 6
          M12 9 H22 V12 H19 V15 H16 V12 H12 Z
        "/>
      </svg>
    </span>
    <span>Secret Rooms</span>
  </span>

  <input type="checkbox" data-poi-toggle="secretRoom" checked>
</label>

<label class="map-toggle">
  <span class="map-toggle-name">
    <span class="map-toggle-icon gas-station-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="
          M5 2 H15 V21 H5 Z
          M7 4 V9 H13 V4 Z
          M15 6 H18 L21 9 V18
          A3 3 0 0 1 18 21
          H17 V18 H18 V10 L16 8 H15 Z
        "/>
      </svg>
    </span>
    <span>Gas Stations</span>
  </span>

  <input type="checkbox" data-poi-toggle="gasStation" checked>
</label>


</div>

    <div class="map-layer">

      <div class="map-tiles" role="img" aria-label="Taego Map">
        <img src="assets/taego-0-0.png" alt="" style="left:0%;top:0%" />
        <img src="assets/taego-0-1.png" alt="" style="left:25%;top:0%" />
        <img src="assets/taego-0-2.png" alt="" style="left:50%;top:0%" />
        <img src="assets/taego-0-3.png" alt="" style="left:75%;top:0%" />
        <img src="assets/taego-1-0.png" alt="" style="left:0%;top:25%" />
        <img src="assets/taego-1-1.png" alt="" style="left:25%;top:25%" />
        <img src="assets/taego-1-2.png" alt="" style="left:50%;top:25%" />
        <img src="assets/taego-1-3.png" alt="" style="left:75%;top:25%" />
        <img src="assets/taego-2-0.png" alt="" style="left:0%;top:50%" />
        <img src="assets/taego-2-1.png" alt="" style="left:25%;top:50%" />
        <img src="assets/taego-2-2.png" alt="" style="left:50%;top:50%" />
        <img src="assets/taego-2-3.png" alt="" style="left:75%;top:50%" />
        <img src="assets/taego-3-0.png" alt="" style="left:0%;top:75%" />
        <img src="assets/taego-3-1.png" alt="" style="left:25%;top:75%" />
        <img src="assets/taego-3-2.png" alt="" style="left:50%;top:75%" />
        <img src="assets/taego-3-3.png" alt="" style="left:75%;top:75%" />
      </div>

  <svg class="measurement-overlay">
    <line class="measurement-line"></line>
  </svg>

      <div class="me-marker"></div>
      <div class="target-marker"></div>      

    </div>
    
    
    <div class="distance-label"></div>
    <div class="watermark">
  <div>PTacMap by Ocho</div>
  <div class="version">v0.3.4-beta</div>
</div>
  </div>

  <script src="script.js"></script>

</body>
</html>
